<svg xmlns="http://www.w3.org/2000/svg" width="900" height="300" viewBox="0 0 900 300" role="img" aria-label="What I build: frontend, backend, data, devops">
  <rect width="900" height="300" rx="12" fill="#0a0a0a"/>
  <g font-family="'Segoe UI', Arial, sans-serif">
    <g>
      <rect x="20" y="20" width="430" height="120" rx="8" fill="#111111" stroke="#ffffff" stroke-opacity="0.18"/>
      <text x="42" y="52" font-family="'Courier New', monospace" font-size="13" letter-spacing="3" fill="#ffffff" fill-opacity="0.45">01</text>
      <text x="42" y="84" font-size="22" font-weight="700" fill="#ffffff">Frontend</text>
      <text x="42" y="112" font-size="14" fill="#ffffff" fill-opacity="0.7">Fast, responsive interfaces with React and Vue</text>
    </g>
    <g>
      <rect x="470" y="20" width="410" height="120" rx="8" fill="#111111" stroke="#ffffff" stroke-opacity="0.18"/>
      <text x="492" y="52" font-family="'Courier New', monospace" font-size="13" letter-spacing="3" fill="#ffffff" fill-opacity="0.45">02</text>
      <text x="492" y="84" font-size="22" font-weight="700" fill="#ffffff">Backend</text>
      <text x="492" y="112" font-size="14" fill="#ffffff" fill-opacity="0.7">APIs and services in Node.js, Go and Python</text>
    </g>
    <g>
      <rect x="20" y="160" width="430" height="120" rx="8" fill="#111111" stroke="#ffffff" stroke-opacity="0.18"/>
      <text x="42" y="192" font-family="'Courier New', monospace" font-size="13" letter-spacing="3" fill="#ffffff" fill-opacity="0.45">03</text>
      <text x="42" y="224" font-size="22" font-weight="700" fill="#ffffff">Data</text>
      <text x="42" y="252" font-size="14" fill="#ffffff" fill-opacity="0.7">Relational schemas on PostgreSQL and MySQL</text>
    </g>
    <g>
      <rect x="470" y="160" width="410" height="120" rx="8" fill="#111111" stroke="#ffffff" stroke-opacity="0.18"/>
      <text x="492" y="192" font-family="'Courier New', monospace" font-size="13" letter-spacing="3" fill="#ffffff" fill-opacity="0.45">04</text>
      <text x="492" y="224" font-size="22" font-weight="700" fill="#ffffff">DevOps</text>
      <text x="492" y="252" font-size="14" fill="#ffffff" fill-opacity="0.7">Containerized deployments with Docker and Kubernetes</text>
